<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Forex Trading</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,Cantarell,sans-serif; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:#334155; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .card { background:#fff; padding:40px; border-radius:20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); max-width: 420px; text-align:center; }
    .icon { font-size:64px; margin-bottom:20px; }
    h1 { font-size: 28px; margin: 0 0 10px; color:#333; }
    p { font-size: 16px; color:#666; margin:0 0 30px; line-height:1.6; }
    .btn { display:inline-block; background:#3498db; color:#fff; padding:15px 30px; border-radius:10px; text-decoration:none; font-weight:600; border:none; cursor:pointer; font-size:16px; transition: background 0.3s; }
    .btn:hover { background:#2980b9; }
    .status { margin-top:20px; font-size:14px; color:#999; }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    .checking { animation: pulse 2s infinite; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>Some features may not be available until you're back online. Cached data will load when possible.</p>
    <button class="btn" onclick="location.reload()">Try Again</button>
    <div class="status">
      <span id="status" class="checking">Checking connection...</span>
    </div>
  </div>
  
  <script>
    // Auto-reload when back online
    window.addEventListener('online', () => {
      document.getElementById('status').textContent = 'Connection restored!';
      setTimeout(() => location.reload(), 1000);
    });
    
    window.addEventListener('offline', () => {
      document.getElementById('status').textContent = 'Still offline...';
    });
    
    // Check if actually online
    if (navigator.onLine) {
      document.getElementById('status').textContent = 'Online - retrying...';
      setTimeout(() => location.reload(), 1000);
    } else {
      document.getElementById('status').textContent = 'Waiting for connection...';
    }
  </script>
</body>
</html>
