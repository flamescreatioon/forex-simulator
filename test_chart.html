<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Test</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #chart-container { 
            width: 100%; 
            height: 500px; 
            background: #f5f5f5;
            border: 2px solid #333;
        }
        .status { padding: 10px; background: #e0e0e0; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Chart Library Test</h1>
    <div class="status" id="status">Loading...</div>
    <div id="chart-container"></div>

    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        const status = document.getElementById('status');
        
        console.log('Script started');
        status.textContent = 'Script started...';
        
        // Check if library loaded
        if (typeof LightweightCharts === 'undefined') {
            status.textContent = 'ERROR: LightweightCharts library not loaded!';
            status.style.background = '#ffcccc';
            console.error('Library not loaded');
        } else {
            status.textContent = 'LightweightCharts library loaded ✓';
            status.style.background = '#ccffcc';
            console.log('Library loaded:', LightweightCharts);
            
            try {
                // Create chart
                const container = document.getElementById('chart-container');
                console.log('Container:', container);
                
                const chart = LightweightCharts.createChart(container, {
                    width: container.clientWidth,
                    height: 500,
                    layout: {
                        background: { color: '#ffffff' },
                        textColor: '#333',
                    }
                });
                
                console.log('Chart created:', chart);
                status.textContent += ' | Chart created ✓';
                
                // Fetch data from candles.php
                fetch('helpers/candles.php')
                    .then(response => {
                        console.log('Fetch response:', response);
                        if (!response.ok) throw new Error('HTTP ' + response.status);
                        return response.json();
                    })
                    .then(data => {
                        console.log('Data received:', data.length, 'candles');
                        status.textContent += ' | Data loaded (' + data.length + ' candles) ✓';
                        
                        // Add candlestick series
                        const candlestickSeries = chart.addCandlestickSeries({
                            upColor: '#26a69a',
                            downColor: '#ef5350',
                            borderVisible: false,
                            wickUpColor: '#26a69a',
                            wickDownColor: '#ef5350',
                        });
                        
                        candlestickSeries.setData(data);
                        console.log('Chart should be visible now');
                        status.textContent += ' | Chart rendered ✓';
                    })
                    .catch(err => {
                        console.error('Error loading data:', err);
                        status.textContent = 'ERROR loading data: ' + err.message;
                        status.style.background = '#ffcccc';
                    });
                    
            } catch (err) {
                console.error('Error creating chart:', err);
                status.textContent = 'ERROR creating chart: ' + err.message;
                status.style.background = '#ffcccc';
            }
        }
    </script>
</body>
</html>
